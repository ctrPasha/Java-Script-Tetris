<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link rel="stylesheet" href="styles.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <header>
      <h1>TETRIS</h1>
    </header>

    <div class="container-fluid" id="main-container">
      
        <canvas id="board" class="game-board"></canvas>
        <button onclick="play()" class="play-btn" id="play-btn">Play</button>
      
      <div class="container-md" id="stat-container">
        <p>SCORE</p>
        <div id="scoreBox">
          <span id="score">0</span>
        </div>

        <p>LEVEL</p>
        <div id="lvlBox">
          <span id="level">0</span>
        </div>

        <p>LINES</p>
        <div id="lineBox">
          <span id="lines">0</span>
        </div>
      </div>
      
        
      
      
  







    </div>


    <script src="./components/Interface.js"></script>
    <script src="./components/Points.js"></script>
    <script src="./components/index.js"></script>
    <script src="./components/Board.js"></script>
    <script src="./components/Shapes.js"></script>
    <script src="./components/Controls.js"></script>
    <script src="./components/Tetraminos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
